name: Usage Metering & Billing Engine
track: FlyRank Internship — Backend Track
stack: Python / FastAPI / PostgreSQL / Stripe (test mode)

run: docker compose up
seed: docker compose exec api python -m scripts.seed
test: pytest -q
base_url: http://localhost:8000

endpoints:
  - method: POST
    path: /generate
    headers: [X-Tenant-Id, Idempotency-Key]
    description: Dummy billable action — records usage, enforces quota, returns per-event cost.
  - method: GET
    path: /usage
    headers: [X-Tenant-Id]
    description: Rollup — used / limit / cost for the current billing period.
  - method: POST
    path: /billing/checkout
    headers: [X-Tenant-Id]
    description: Creates a Stripe test-mode Checkout Session for upgrading to Pro.
  - method: POST
    path: /webhooks/stripe
    headers: [Stripe-Signature]
    description: Verified, deduplicated Stripe webhook handler.
  - method: GET
    path: /health
    description: Liveness check.
